<svg class="bv-svg bv-standalone" xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 816 664" role="img" aria-label="Chain of trust on the i.MX95, from the keys in the ELE ROM and fuses to U-Boot and the kernel" width="816" height="664"><title>The chain of trust</title><style>.bv-svg{--bv-m33:#e8590c;--bv-a55:#1971c2;--bv-m7:#7048e8;--bv-ele:#c2255c;--bv-rom:#868e96;--bv-sram:#0c8599;--bv-ddr:#b88a00;--bv-flash:#5c940d;--bv-ok:#10b981;--bv-bad:#ef4444;--bv-on-c:#ffffff;--bv-fg:var(--global-text-color,#1f2328);--bv-fg2:var(--global-text-color-light,#5f6b7a);--bv-bg:var(--global-bg-color,#ffffff);--bv-line:var(--surface-border,#d0d7de);--bv-acc:var(--global-theme-color,#1971c2);display:block;width:100%;height:auto;overflow:visible;font-size:12px}
html[data-theme="dark"] .bv-svg{--bv-m33:#ff8a4c;--bv-a55:#4dabf7;--bv-m7:#9775fa;--bv-ele:#f06595;--bv-rom:#adb5bd;--bv-sram:#3bc9db;--bv-ddr:#fcc419;--bv-flash:#94d82d;--bv-ok:#34d399;--bv-bad:#f87171;--bv-on-c:#10131a;}
.bv-svg text{fill:var(--bv-fg)}
.bv-svg .board{fill:none;stroke:var(--bv-line);stroke-width:1.5;stroke-dasharray:6 5}
.bv-svg .tl-box{fill:none;stroke:var(--bv-line);stroke-width:1.2}
.bv-svg .lbl{fill:var(--bv-fg2);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:650}
.bv-svg .note{fill:var(--bv-fg2);font-size:10.5px}
.bv-svg .note tspan.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bv-soc .soc-box{fill:color-mix(in srgb,var(--bv-fg) 3%,var(--bv-bg));stroke:var(--bv-line);stroke-width:1.5;transition:stroke .5s}
.bv-soc[data-s~=pw] .soc-box{stroke:var(--bv-fg2)}
.bv-blk .box{fill:var(--bv-bg);stroke:var(--bv-line);stroke-width:1.4;transition:fill .45s,stroke .45s,stroke-width .45s}
.bv-blk .t{font-size:12.5px;font-weight:650;text-anchor:middle;fill:var(--bv-fg2);transition:fill .45s}
.bv-blk .s{font-size:10.5px;text-anchor:middle;fill:var(--bv-fg2)}
.bv-blk .s.v1,.bv-blk .s.v2{display:none;fill:var(--c);font-weight:650}
.bv-blk[data-s~=v1] .s.v0,.bv-blk[data-s~=v2] .s.v0,.bv-blk[data-s~=v2] .s.v1{display:none}
.bv-blk[data-s~=v1] .s.v1,.bv-blk[data-s~=v2] .s.v2{display:inline}
.bv-blk[data-s~=pw] .box{stroke:color-mix(in srgb,var(--c) 55%,var(--bv-line))}
.bv-blk[data-s~=pw] .t,.bv-blk[data-s~=on] .t{fill:var(--bv-fg)}
.bv-blk[data-s~=on] .box{fill:color-mix(in srgb,var(--c) 14%,var(--bv-bg));stroke:var(--c);stroke-width:2.2}
.bv-blk.k-core[data-s~=on] .box{fill:color-mix(in srgb,var(--c) 24%,var(--bv-bg))}
.bv-blk[data-s~=dim]{opacity:.4}
.bv-blk[data-s~=glow] .box{animation:bv-glow 1.8s ease-in-out infinite}
@keyframes bv-glow{0%,100%{filter:drop-shadow(0 0 7px color-mix(in srgb,var(--c) 75%,transparent))}50%{filter:drop-shadow(0 0 2px color-mix(in srgb,var(--c) 40%,transparent))}}
.bv-blk .hatch{opacity:0;pointer-events:none;transition:opacity .45s}
.bv-blk.k-rom .hatch{opacity:.3}
.bv-blk[data-s~=lock] .hatch{opacity:.5}
.bv-hl{stroke:var(--bv-fg2);stroke-width:1.1}
.bv-blk .lock{opacity:0;transition:opacity .45s}
.bv-blk[data-s~=lock] .lock{opacity:1}
.bv-blk[data-s~=pulse] .lock{animation:bv-blink .7s ease-in-out 4}
@keyframes bv-blink{50%{opacity:.15}}
.bv-blk .lock path{fill:none;stroke:var(--bv-fg);stroke-width:1.6}
.bv-blk .lock rect{fill:var(--bv-bg);stroke:var(--bv-fg);stroke-width:1.6}
.bv-blk .mini{fill:none;stroke:var(--c);stroke-opacity:.3;stroke-width:1.2;transition:stroke-opacity .45s}
.bv-blk[data-s~=pw] .mini,.bv-blk[data-s~=on] .mini{stroke-opacity:.75}
.bv-blk .sine{fill:none;stroke:var(--bv-line);stroke-width:1.6;transition:stroke .45s}
.bv-blk[data-s~=on] .sine{stroke:var(--c);stroke-dasharray:6 3;animation:bv-dash .6s linear infinite}
.bv-blk .slot{fill:var(--bv-bg);stroke:var(--bv-fg2);stroke-width:1.1}
.bv-blk .knob{fill:var(--bv-fg2);transition:fill .45s}
.bv-blk[data-s~=on] .knob{fill:var(--c)}
.bv-blk.k-chip .t{font-size:10.5px}
.bv-blk.k-chip .box{stroke-dasharray:3 3}
.bv-blk.k-chip[data-s~=on] .box{stroke-dasharray:none;stroke-width:1.6}
.bv-wire{--c:var(--bv-fg);fill:none;stroke:var(--bv-line);stroke-width:1.6;stroke-dasharray:4 4;transition:stroke .45s,stroke-width .45s}
.bv-wire[data-s~=on]{stroke:var(--c);stroke-dasharray:none;stroke-width:2.2}
.bv-wire[data-s~=ok]{stroke:var(--bv-ok);stroke-dasharray:none;stroke-width:2.4}
.bv-wire[data-s~=bad]{stroke:var(--bv-bad);stroke-dasharray:6 4;stroke-width:2.4}
.bv-wl{font-size:9.5px;font-weight:650;fill:var(--bv-fg2)}
.bv-flow{fill:none;stroke:var(--c);stroke-width:2.2;stroke-dasharray:3 7;stroke-linecap:round;opacity:0;transition:opacity .45s}
.bv-flow[data-s~=on]{opacity:1;animation:bv-dash .8s linear infinite}
@keyframes bv-dash{to{stroke-dashoffset:-20}}
.bv-tag{opacity:0;transition:opacity .45s}
.bv-tag[data-s~=on]{opacity:1}
.bv-tag text{font-size:10.5px;fill:var(--bv-fg2)}
.bv-tag text.em{fill:var(--c);font-weight:650}
.bv-tag path{fill:none;stroke:var(--c);stroke-width:1.6}
.bv-blk.k-cell .t{font-size:10.5px}
.bv-seg{stroke:var(--bv-line);stroke-width:1}
.bv-seg.meta{fill:color-mix(in srgb,var(--bv-fg) 9%,var(--bv-bg))}
.bv-seg.boot{fill:color-mix(in srgb,var(--bv-flash) 40%,var(--bv-bg));stroke:var(--bv-flash);stroke-width:1.4}
.bv-seg.part{fill:color-mix(in srgb,var(--bv-flash) 12%,var(--bv-bg))}
.bv-seg.free{fill:none;stroke-dasharray:3 3}
.bv-segt{font-size:10.5px;text-anchor:middle}
.bv-strip{opacity:.35;transition:opacity .45s}
.bv-strip[data-s~=on]{opacity:1}
.bv-tr .base{fill:none;stroke:var(--bv-line);stroke-width:1.1;stroke-dasharray:3 3}
.bv-tr .ramp{fill:none;stroke:var(--c);stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.2s ease-in-out}
.bv-tr[data-s~=on] .ramp{stroke-dashoffset:0}
.bv-tr .tl{font-size:10px;fill:var(--bv-fg2);transition:fill .45s}
.bv-tr[data-s~=on] .tl{fill:var(--bv-fg)}
.bv-tr .mark{stroke:var(--c);stroke-width:1;stroke-dasharray:2 3;opacity:0;transition:opacity .45s .9s}
.bv-tr .mt{font-size:10px;fill:var(--c);font-weight:650;opacity:0;transition:opacity .45s .9s}
.bv-tr[data-s~=on] .mark,.bv-tr[data-s~=on] .mt{opacity:1}
.bv-mv{opacity:0;transition:opacity .3s}
.bv-mv[data-s~=show]{opacity:1}
.bv-mv rect{fill:var(--c);filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.bv-mv text{fill:var(--bv-on-c);font-size:10px;font-weight:700;text-anchor:middle}
.bv-badge{opacity:0;transform:scale(.3);transform-box:fill-box;transform-origin:center;transition:opacity .3s,transform .45s cubic-bezier(.3,1.6,.5,1)}
.bv-badge[data-s~=on]{opacity:1;transform:scale(1)}
.bv-badge circle{fill:var(--c);stroke:var(--bv-bg);stroke-width:2}
.bv-badge path{fill:none;stroke:var(--bv-on-c);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bv-term .box{fill:#1f2328;stroke:var(--bv-line)}
.bv-term text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;fill:#e6edf3}
.bv-term text.p{fill:#7ee787}
.bv-term{opacity:.3;transition:opacity .45s}
.bv-term[data-s~=on]{opacity:1}
.bv-pin circle{fill:var(--bv-acc);stroke:var(--bv-bg);stroke-width:2}
.bv-pin text{fill:#fff;font-size:10.5px;font-weight:700;text-anchor:middle}
.bv-caps text{font-size:11.5px;fill:var(--bv-fg)}
.bv-caps text.n{font-weight:700;fill:var(--bv-acc)}
.c-m33{--c:var(--bv-m33)}.c-a55{--c:var(--bv-a55)}.c-m7{--c:var(--bv-m7)}.c-ele{--c:var(--bv-ele)}
.c-rom{--c:var(--bv-rom)}.c-sram{--c:var(--bv-sram)}.c-ddr{--c:var(--bv-ddr)}.c-flash{--c:var(--bv-flash)}
.c-ok{--c:var(--bv-ok)}.c-bad{--c:var(--bv-bad)}.c-pwr{--c:var(--bv-fg)}.c-acc{--c:var(--bv-acc)}
.bv-instant *,.bv-instant{transition:none!important}
.bv-svg.bv-standalone{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
@media (prefers-color-scheme:dark){.bv-svg.bv-standalone{--bv-m33:#ff8a4c;--bv-a55:#4dabf7;--bv-m7:#9775fa;--bv-ele:#f06595;--bv-rom:#adb5bd;--bv-sram:#3bc9db;--bv-ddr:#fcc419;--bv-flash:#94d82d;--bv-ok:#34d399;--bv-bad:#f87171;--bv-on-c:#10131a;--bv-fg:#e6edf3;--bv-fg2:#9ba7b4;--bv-bg:#16181d;--bv-line:#3a414b;--bv-acc:#4dabf7}}
.bv-standalone *{animation:none!important;transition:none!important}
.bv-standalone .bv-bgrect{fill:var(--bv-bg)}</style><rect class="bv-bgrect" x="-8" y="-8" width="816" height="664" rx="14"/><defs><pattern id="s-trust-h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="bv-hl" x1="0" y1="0" x2="0" y2="7"/></pattern><marker id="s-trust-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text class="lbl" x="20" y="24">Roots of trust</text><g class="bv-blk k-mem k-rom c-rom" data-id="nxpKey" data-s="on"><rect class="box" x="20" y="36" width="200" height="46" rx="3"/><rect class="hatch" x="20" y="36" width="200" height="46" rx="3" fill="url(#s-trust-h)"/><text class="t" x="120" y="57">NXP public key</text><text class="s v0" x="120" y="71">inside the ELE ROM</text></g><g class="bv-blk k-mem c-rom" data-id="srk" data-s="on"><rect class="box" x="250" y="36" width="310" height="46" rx="3"/><text class="t" x="405" y="57">Your SRK hash</text><text class="s v0" x="405" y="71">burned into fuses</text></g><path class="bv-wire c-rom" data-id="kN" d="M135,82 V156" data-s="on"/><path class="bv-wire c-rom" data-id="kS1" d="M265,82 V156" data-s="on"/><path class="bv-wire c-rom" data-id="kS2" d="M525,82 V156" data-s="on"/><text class="lbl" x="20" y="122">Chain of trust</text><g class="bv-blk k-core c-ele" data-id="cRom" data-s="on"><rect class="box" x="20" y="132" width="100" height="60" rx="9"/><text class="t" x="70" y="160">ELE ROM</text><text class="s v0" x="70" y="174">in silicon</text></g><g class="bv-blk k-core c-ele" data-id="cFw" data-s="on"><rect class="box" x="150" y="132" width="100" height="60" rx="9"/><text class="t" x="200" y="160">ELE FW</text><text class="s v0" x="200" y="174">container 1</text></g><g class="bv-blk k-mem c-m33" data-id="cC2" data-s="on"><rect class="box" x="280" y="132" width="100" height="60" rx="3"/><text class="t" x="330" y="160">Container 2</text><text class="s v0" x="330" y="174">OEI · SM · SPL</text></g><g class="bv-blk k-core c-a55" data-id="cSpl" data-s="on"><rect class="box" x="410" y="132" width="100" height="60" rx="9"/><text class="t" x="460" y="160">SPL</text><text class="s v0" x="460" y="174">on the A55</text></g><g class="bv-blk k-mem c-a55" data-id="cC3" data-s="on"><rect class="box" x="540" y="132" width="100" height="60" rx="3"/><text class="t" x="590" y="160">Container 3</text><text class="s v0" x="590" y="174">TF-A · U-Boot</text></g><g class="bv-blk c-acc k-chip" data-id="cOs" data-s="on"><rect class="box" x="670" y="132" width="110" height="60" rx="3"/><text class="t" x="725" y="160">Kernel</text><text class="s v0" x="725" y="174">signed FIT image</text></g><path class="bv-wire c-ele" data-id="e1" d="M120,162 H148" marker-end="url(#s-trust-a)" data-s="ok"/><path class="bv-wire c-ele" data-id="e2" d="M250,162 H278" marker-end="url(#s-trust-a)" data-s="ok"/><path class="bv-wire c-a55" data-id="e3" d="M380,162 H408" marker-end="url(#s-trust-a)" data-s="on"/><path class="bv-wire c-ele" data-id="e4" d="M510,162 H538" marker-end="url(#s-trust-a)" data-s="ok"/><path class="bv-wire c-a55" data-id="e5" d="M640,162 H668" marker-end="url(#s-trust-a)" data-s="on"/><g class="bv-tag" data-id="checks" data-s="on"><text x="20" y="214">Each arrow is a check before a jump. The ELE does every check up to container 3; U-Boot checks the kernel itself.</text></g><g class="bv-badge c-ok" data-id="bFw" data-s="on"><circle cx="250" cy="132" r="9.5"/><path d="M245.8,132 l3,3 l5.6,-6"/></g><g class="bv-badge c-ok" data-id="bC2" data-s="on"><circle cx="380" cy="132" r="9.5"/><path d="M375.8,132 l3,3 l5.6,-6"/></g><g class="bv-badge c-bad" data-id="xC2"><circle cx="380" cy="132" r="9.5"/><path d="M376.5,128.5 l7,7 M383.5,128.5 l-7,7"/></g><g class="bv-badge c-ok" data-id="bC3" data-s="on"><circle cx="640" cy="132" r="9.5"/><path d="M635.8,132 l3,3 l5.6,-6"/></g><g class="bv-blk c-acc" data-id="lc" data-s="on"><rect class="box" x="20" y="244" width="200" height="60" rx="3"/><text class="t" x="120" y="272">Lifecycle</text><text class="s v0" x="120" y="286">OEM open: log only</text></g><g class="bv-tag" data-id="lcNote"><text x="20" y="324">Set once with ahab_close.</text><text x="20" y="340">There is no way back.</text></g><g class="bv-term" data-id="term" data-s="on"><rect class="box" x="250" y="244" width="530" height="96" rx="8"/><text x="264" y="266"><tspan class="p">=&gt;</tspan> ahab_status</text><text x="264" y="286">Lifecycle: 0x00000010, OEM Open</text><text x="264" y="326">        No Events Found!</text></g><g class="bv-caps"><text class="n" x="12" y="412">1.</text><text x="34" y="412">Two roots of trust, both fixed in the chip: NXP's public key inside the ELE ROM, and a hash of your own public keys,</text><text x="34" y="428">the SRK hash, burned into fuses.</text><text class="n" x="12" y="448">2.</text><text x="34" y="448">The ELE ROM checks the ELE firmware in container 1 against NXP's key, then starts it. This check happens on every</text><text x="34" y="464">part, open or closed.</text><text class="n" x="12" y="484">3.</text><text x="34" y="484">The boot ROM asks the ELE firmware to check container 2. The ELE compares the container's key table with the fuse</text><text x="34" y="500">hash, verifies the signature, and checks every image against its hash.</text><text class="n" x="12" y="520">4.</text><text x="34" y="520">Container 2 brings SPL, and the A55 starts running it.</text><text class="n" x="12" y="540">5.</text><text x="34" y="540">SPL asks the ELE to check container 3 with the same keys before it jumps to TF-A and U-Boot. This link only exists if</text><text x="34" y="556">U-Boot is built with CONFIG_AHAB_BOOT.</text><text class="n" x="12" y="576">6.</text><text x="34" y="576">U-Boot extends the chain to the kernel, with a signed FIT image or an OS container. Setting up that link is up to you;</text><text x="34" y="592">part 6 comes back to it.</text><text class="n" x="12" y="612">7.</text><text x="34" y="612">On a running board, ahab_status in U-Boot shows the lifecycle and every security event the ELE recorded. A correctly</text><text x="34" y="628">signed chain shows none.</text></g></svg>